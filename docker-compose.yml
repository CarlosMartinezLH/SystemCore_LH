services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: lanahora-keycloak-db
    restart: unless-stopped
    user: "70:70"
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${KC_DB_NAME:-keycloak}
      POSTGRES_USER: ${KC_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-lanahora_db_secret_key_2026}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - lanahora-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: lanahora-keycloak-server
    restart: unless-stopped
    command: start-dev --import-realm
    security_opt:
      - no-new-privileges:true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-lanahora_db_secret_key_2026}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin_secure_password_2026}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak/data/import:/opt/keycloak/data/import:ro
    ports:
      # Enlazar exclusivamente al localhost local para evitar exposición directa fuera de Cloudflare
      - "127.0.0.1:8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - lanahora-network

volumes:
  keycloak_postgres_data:
    driver: local

networks:
  lanahora-network:
    driver: bridge
